name: Build & Publish
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: pkg
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./package.json').version+'\n')"

      - name: List Windows artifacts
        shell: pwsh
        run: |
          Write-Host "=== release dir ==="
          if (Test-Path release) { Get-ChildItem -Recurse -File release } else { Write-Host "no release dir" }
          Write-Host "=== dist dir ==="
          if (Test-Path dist) { Get-ChildItem -Recurse -File dist } else { Write-Host "no dist dir" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            release/**/*.exe
            dist/**/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    needs: [win]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build macOS DMG
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List macOS artifacts
        shell: bash
        run: |
          echo "=== release dir ==="
          ls -R release || true
          echo "=== dist dir ==="
          ls -R dist || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            release/**/*.dmg
            dist/**/*.dmg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [win, mac]
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./package.json').version+'\n')"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify installers exist
        run: |
          echo "=== artifacts tree ==="
          find artifacts -type f -print || true
          COUNT=$(find artifacts -type f \( -name "*.exe" -o -name "*.dmg" \) | wc -l)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No installers (*.exe/*.dmg) found under 'artifacts/'."
            exit 1
          fi

      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          # publish to the existing tag's release (or create if missing)
          draft: false
          make_latest: true
          files: |
            artifacts/**            # ← upload everything we downloaded: exe, dmg, yml, blockmap, etc.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            artifacts/**/*.dmg
