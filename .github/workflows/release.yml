name: Build & Publish
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: pkg
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./package.json').version+'\n')"

      - name: List built artifacts (Win)
        shell: pwsh
        run: |
          Write-Host "Listing dist and release directories"
          if (Test-Path dist) { Get-ChildItem -Recurse -File dist } else { Write-Host "dist not found" }
          if (Test-Path release) { Get-ChildItem -Recurse -File release } else { Write-Host "release not found" }

      - name: Upload installers to Release (Win)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          files: |
            dist/*Setup*.exe
            dist/*.exe
            dist/**/Setup*.exe
            release/*Setup*.exe
            release/*.exe
            release/**/Setup*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build macOS DMG
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: pkg
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./package.json').version+'\n')"

      - name: List built artifacts (Mac)
        shell: bash
        run: |
          echo "Listing dist and release directories"
          ls -R dist || true
          ls -R release || true

      - name: Upload installers to Release (Mac)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          files: |
            dist/*.dmg
            dist/**/*.dmg
            release/*.dmg
            release/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
